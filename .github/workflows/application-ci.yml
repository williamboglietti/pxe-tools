name: Application behavior

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  application-behavior:
    name: Application behavior (Debian 13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the test environment
        run: docker build --tag pxe-tools-application-test:local tests/ci
      - name: Exercise application behavior in isolation
        run: |
          docker run --rm --network none --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add KILL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=256m \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --workdir /tmp pxe-tools-application-test:local bash -c '
              set -euo pipefail
              mkdir workspace
              tar -C /source -cf - . | tar -C workspace --no-same-owner -xf -
              cd workspace
              exec bash tests/ci/run-application-tests.sh
            '
      - name: Verify writable-volume deletion as the web user
        run: |
          docker run --rm --network none --user www-data \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --workdir /source pxe-tools-application-test:local \
            bash tests/integration/test_image_delete_web_legacy.sh
