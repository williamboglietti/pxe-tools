name: Check dedicated Cloudflare Worker permissions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check dedicated access and another Worker denial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACKAGES_PXETOOLS_COM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 packaging/ci/cloudflare-permissions-check.py
