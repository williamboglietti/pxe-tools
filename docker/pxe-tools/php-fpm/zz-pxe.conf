[www]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/2

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; SEC-05 : borne dure body POST. Couvre les POST /api/ (checkpoint,
; install-start) ET les forms de l'UI admin (wizard d'install : réseau +
; partitionnement + automatisation + presets à nombreuses options peut
; dépasser 16K — vu en pratique avec un preset "board" à 16424 bytes,
; au-delà PHP vide $_POST silencieusement, y compris le token CSRF, ce qui
; fait échouer la requête avec un 403 trompeur). 2M reste très loin d'un
; risque mémoire (20 workers × 2M = 40MB) et sous le client_max_body_size
; nginx (16M).
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M
