# PXE endpoints — port 80, accessibles sans auth (clients = machines en boot PXE)
# Sert : preseed.php, grub.php, discover.sh/disktest.sh, wipe.sh (dynamique PHP),
#        /api/, /netboot/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/http;
    index index.html;

    access_log /var/log/nginx/pxe-access.log main;
    error_log  /var/log/nginx/pxe-error.log;

    # SEC-01/SEC-08 : autoindex désactivé au niveau server. Pas de cas d'usage
    # légitime (les clients d-i connaissent les chemins exacts via les menus
    # PXE générés). Empêche l'énumération `curl http://pxe/postboot/` qui
    # listait les action_id en cours.
    autoindex off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Tous les .php du HTTP root (preseed.php, grub.php) → php-fpm via socket Unix
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # API PXE (install-start, install-end, discovery) — exécutée par l'admin app
    # Pas d'auth (le client est la machine en install, pas un humain)
    location /api/ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
    }

    # SEC-01 : /postboot/ servi par le front controller PHP (auth MAC↔IP).
    # Le fichier physique vit hors document root nginx (POSTBOOT_OUTPUT_DIR).
    location /postboot/ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
    }

    # /pxe/postboot/{action_id}/{file} : postboot.sh + pxe-postboot.service
    # téléchargés par le late_command du preseed (PxeController::serveActionFile,
    # filtre pxe_subnet). Sans ce bloc la requête tombe dans `location /`
    # (try_files statique) → 404 → fichiers vides côté machine, os_first_boot
    # jamais émis et 10 min d'attente worker à chaque installation.
    location /pxe/postboot/ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
    }

    # /wipe.sh — rendu DYNAMIQUE par MAC via PxeController::wipeScript.
    # Disques, token, action et wipe_id inlinés au render (plus de /api/wipe-job).
    # Match exact prioritaire sur le regex (discover|disktest).sh ci-dessous.
    location = /wipe.sh {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
    }

    # Scripts shell exécutés par d-i partman/early_command (discover/disktest)
    # Rendus par bootstrap-render-templates.sh dans /srv/http/ avec ORCH_IP injecté
    # depuis settings DB (orchestrator_ip). Servis depuis le root par défaut.
    # Content-Type explicite text/x-shellscript pour clarté côté wget côté client.
    location ~ ^/(discover|disktest)\.sh$ {
        try_files $uri =404;
        default_type text/x-shellscript;
    }

    # Spec H — Script iPXE chainloadé (Content-Type text/plain pour parsing iPXE)
    location ~ \.ipxe$ {
        try_files $uri =404;
        default_type text/plain;
    }

    location /netboot/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
