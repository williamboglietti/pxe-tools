[global]
daemonize = no
error_log = /var/log/pxe-tools/php-fpm.log
[pxe-tools]
user = www-data
group = www-data
listen = /run/pxe-tools-php/fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M
