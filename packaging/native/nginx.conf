user www-data;
worker_processes 1;
error_log stderr notice;
pid /run/pxe-tools-nginx/nginx.pid;
events { worker_connections 512; }
http {
    client_body_temp_path /run/pxe-tools-nginx/client_body;
    proxy_temp_path /run/pxe-tools-nginx/proxy;
    fastcgi_temp_path /run/pxe-tools-nginx/fastcgi;
    uwsgi_temp_path /run/pxe-tools-nginx/uwsgi;
    scgi_temp_path /run/pxe-tools-nginx/scgi;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/pxe-tools/nginx-access.log main;
    sendfile on;
    server_tokens off;
    client_max_body_size 16M;
    include /run/pxe-tools-nginx/conf.d/*.conf;
}
